name: Build VOD TMDB ID candidate overlays

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Records without TMDB IDs to search per batch (1-500)"
        required: true
        default: "100"
        type: string
      offset:
        description: "Number of eligible records to skip before this batch"
        required: true
        default: "0"
        type: string
      batch_count:
        description: "Number of consecutive bounded read-only search batches (1-9)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: acervo-v2-vod-id-candidates
  cancel-in-progress: false

jobs:
  suggest-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded batch inputs
        env:
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^[1-9][0-9]{0,2}$ ]] && (( LIMIT <= 500 ))
          [[ "$OFFSET" =~ ^[0-9]+$ ]]
          [[ "$BATCH_COUNT" =~ ^[1-9]$ ]]
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Generate read-only candidate reports
        env:
          CINEHUB_CATALOG_FUNCTION_URL: https://qdheeiitzlvynshvkwcs.supabase.co/functions/v1/cinehub-catalog
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::SUPABASE_ANON_KEY is required to call the existing CineHUB proxy. TMDB_TOKEN remains in Supabase."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vod-id-reports"
          for ((batch=0; batch<BATCH_COUNT; batch++)); do
            current_offset=$((OFFSET + batch * LIMIT))
            report="$RUNNER_TEMP/vod-id-reports/candidates-$current_offset.json"
            python scripts/suggest_vod_tmdb_matches.py --limit "$LIMIT" --offset "$current_offset" \
              --output "$report" --function-url "$CINEHUB_CATALOG_FUNCTION_URL" --anon-key "$SUPABASE_ANON_KEY"
          done
      - name: Apply only unique exact-title and exact-year matches to staging
        run: |
          set -euo pipefail
          python scripts/apply_vod_tmdb_id_candidates.py --root . \
            --reports "$RUNNER_TEMP"/vod-id-reports/candidates-*.json \
            --staging-root "$RUNNER_TEMP/vod-id-candidate-overlay" \
            --output "$RUNNER_TEMP/vod-id-application-summary.json"
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: cinehub-vod-id-candidates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vod-id-reports/
            ${{ runner.temp }}/vod-id-candidate-overlay/
            ${{ runner.temp }}/vod-id-application-summary.json
          if-no-files-found: error
          retention-days: 14
