name: Build VOD TMDB ID review candidates

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records without TMDB IDs to search (1–500)"
        required: true
        default: "50"
        type: string
  push:
    branches:
      - audit/acervo-hardening-2026-10

permissions:
  contents: read

concurrency:
  group: acervo-vod-id-review
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate review-only suggestions through CineHUB Supabase
        env:
          CINEHUB_CATALOG_FUNCTION_URL: https://qdheeiitzlvynshvkwcs.supabase.co/functions/v1/cinehub-catalog
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIMIT: ${{ inputs.limit || '50' }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Add SUPABASE_ANON_KEY under repository Actions secrets. TMDB_TOKEN stays in Supabase."
            exit 1
          fi
          python -m py_compile scripts/suggest_vod_tmdb_matches.py
          python scripts/suggest_vod_tmdb_matches.py \
            --limit "$LIMIT" \
            --output "$RUNNER_TEMP/vod-tmdb-id-candidates.json"
      - name: Upload review-only suggestions
        uses: actions/upload-artifact@v4
        with:
          name: cinehub-vod-tmdb-id-candidates
          path: ${{ runner.temp }}/vod-tmdb-id-candidates.json
          if-no-files-found: error
          retention-days: 7
