name: Validate catalog

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required catalog schemas and references
        run: python scripts/validate_catalog.py
      - name: Run read-only catalog integrity audit
        run: python scripts/audit_catalog.py > audit-catalog.json
      - name: Run stream and EPG coverage audit (read-only)
        run: python scripts/audit_stream_epg_coverage.py > stream-epg-coverage.json
      - name: Build actionable catalog quality report (read-only; URLs redacted)
        run: python scripts/catalog_quality_report.py > catalog-quality-report.json
      - name: Build VOD metadata enrichment dry-run (read-only; no network)
        run: python scripts/plan_vod_enrichment.py --output vod-enrichment-plan.json
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
      - name: Upload machine-readable audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinehub-acervo-audit-reports
          path: |
            audit-catalog.json
            stream-epg-coverage.json
            catalog-quality-report.json
            vod-enrichment-plan.json
          if-no-files-found: warn
          retention-days: 14
