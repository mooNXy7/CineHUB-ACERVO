name: Validate catalog

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required catalog schemas and references
        run: python scripts/validate_catalog.py
      - name: Run read-only catalog integrity audit
        run: python scripts/audit_catalog.py
      - name: Run stream and EPG coverage audit (read-only)
        run: python scripts/audit_stream_epg_coverage.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
