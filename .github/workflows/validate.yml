name: Validate catalog

on:
  push:
    branches: [main, master, develop/acervo-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_catalog.py
      - run: python scripts/audit_baseline.py --output reports/baseline
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acervo-v2-baseline-${{ github.sha }}
          path: reports/baseline/
          if-no-files-found: warn
