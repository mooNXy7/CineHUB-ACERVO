name: Validate ACERVO V2

on:
  push:
    branches: [main, master, develop/acervo-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acervo-v2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate active catalog without mutation
        run: python scripts/validate_catalog.py
      - name: Validate versioned JSON Schemas
        run: python scripts/validate_schemas.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile project scripts and importers
        run: python -m py_compile scripts/*.py acervo_v2/*.py
      - name: Build full canonical candidate from local catalog
        run: python scripts/build_candidate_catalog.py --root . --output "${{ runner.temp }}/acervo-v2-candidate"
      - name: Validate canonical candidate against schemas
        run: python scripts/validate_schemas.py --candidate-dir "${{ runner.temp }}/acervo-v2-candidate"
      - name: Capture baseline audit
        if: always()
        run: python scripts/audit_baseline.py --output "${{ runner.temp }}/baseline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acervo-v2-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/baseline/
            ${{ runner.temp }}/acervo-v2-candidate/manifest.json
            ${{ runner.temp }}/acervo-v2-candidate/report.json
          if-no-files-found: warn
          retention-days: 14
