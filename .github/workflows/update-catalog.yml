name: Update catalog

on:
  push:
    branches: [main, master]
    paths:
      - "sources/sources.json"
      - "sources/m3u/**"
      - "scripts/update_catalog.py"
      - "scripts/import_reference_catalog.py"
      - "scripts/normalize_catalog.py"
      - "scripts/validate_catalog.py"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acervo-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch only the reference catalog files
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/gabrielsaimo/SaimoPlayer.git /tmp/cinehub-reference
          git -C /tmp/cinehub-reference sparse-checkout set --no-cone \
            '/vod/filmes-*.txt' \
            '/vod/series-*-*.txt' \
            '/vod/fichas.txt' \
            '/vod/busca.txt' \
            '/vod/destaques.txt' \
            '/vod/radios.txt' \
            '/1.m3u' \
            '/3.m3u'
      - name: Merge new channel, VOD, and radio content
        run: python scripts/import_reference_catalog.py --reference-dir /tmp/cinehub-reference
      - name: Refresh other registered M3U sources
        run: python scripts/update_catalog.py
      - name: Normalize and validate
        run: |
          python scripts/normalize_catalog.py
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py
      - name: Commit changes when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog reports
            git commit -m "chore(acervo): discover and merge catalog updates"
            git push
          else
            echo "Sem alterações no acervo."
          fi
