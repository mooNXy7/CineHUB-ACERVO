name: Build ACERVO V2 candidate snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acervo-v2-candidate-snapshot
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Build isolated candidate from repository-owned data
        run: python scripts/build_candidate_catalog.py --root . --output "${{ runner.temp }}/acervo-v2-candidate"
      - name: Validate candidate contracts
        run: python scripts/validate_schemas.py --candidate-dir "${{ runner.temp }}/acervo-v2-candidate"
      - name: Validate active catalog without mutation
        run: python scripts/validate_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: acervo-v2-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/acervo-v2-candidate/
          if-no-files-found: error
          retention-days: 14
