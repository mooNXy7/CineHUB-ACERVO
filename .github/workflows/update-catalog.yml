name: Update catalog

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acervo-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update registered sources
        run: python scripts/update_catalog.py
      - name: Normalize and validate
        run: |
          python scripts/normalize_catalog.py
          python scripts/validate_catalog.py
      - name: Commit changes when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog reports
            git commit -m "chore(acervo): update validated catalog"
            git push
          else
            echo "Sem alterações no acervo."
          fi
