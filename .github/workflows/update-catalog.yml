name: Update catalog

on:
  push:
    branches: [main, master]
    paths:
      - "sources/sources.json"
      - "sources/m3u/**"
      - "catalog/epg/**"
      - "scripts/update_catalog.py"
      - "scripts/import_reference_catalog.py"
      - "scripts/normalize_catalog.py"
      - "scripts/validate_catalog.py"
      - "scripts/update_epg.py"
      - "scripts/update_html_epg.py"
      - "scripts/parse_html_epg.py"
      - ".github/workflows/update-catalog.yml"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acervo-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch only the reference catalog files
        id: reference
        run: |
          if git clone --depth 1 --filter=blob:none --sparse https://github.com/fkuller/SaimoPlayer.git /tmp/cinehub-reference; then
            git -C /tmp/cinehub-reference sparse-checkout set --no-cone \
              '/vod/filmes-*.txt' \
              '/vod/series-*-*.txt' \
              '/vod/fichas.txt' \
              '/vod/busca.txt' \
              '/vod/destaques.txt' \
              '/vod/radios.txt' \
              '/vod/mgeb/links-*.txt' \
              '/vod/redeflix/links-*.txt' \
              '/1.m3u' \
              '/3.m3u'
            echo "REFERENCE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "REFERENCE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::Catálogo de referência indisponível nesta execução; a importação será ignorada e os dados atuais serão preservados."
          fi
      - name: Import reference data with a quality gate
        if: env.REFERENCE_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          REF_SHA="$(git -C /tmp/cinehub-reference rev-parse HEAD)"
          LAST_SHA="$(cat .github/reference-sync.sha 2>/dev/null || true)"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$REF_SHA" != "$LAST_SHA" ]]; then
            git worktree add --detach /tmp/cinehub-acervo-before HEAD
            cleanup() { git worktree remove --force /tmp/cinehub-acervo-before || true; }
            trap cleanup EXIT

            python scripts/import_reference_catalog.py --reference-dir /tmp/cinehub-reference
            python scripts/validate_catalog.py
            python scripts/summarize_reference_import_preview.py \
              --before-root /tmp/cinehub-acervo-before \
              --after-root "$GITHUB_WORKSPACE" \
              --import-report reports/reference-import.json \
              --output /tmp/reference-import-quality-gate.json

            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/reference-import-quality-gate.json").read_text(encoding="utf-8"))
          gate = report.get("review_gate", {})
          reasons = gate.get("blocking_reasons", [])
          print(json.dumps({"status": gate.get("status"), "blocking_reasons": reasons}, ensure_ascii=False))
          if reasons:
              raise SystemExit("Reference import blocked: quality gate requires manual review; no catalog changes will be committed.")
          PY
            printf '%s\n' "$REF_SHA" > .github/reference-sync.sha
            echo "Catálogo de referência passou pelos controles estruturais: $REF_SHA"
          else
            echo "Nenhum novo commit na referência; importação pesada ignorada."
          fi
      - name: Refresh other registered M3U sources
        run: python scripts/update_catalog.py
      - name: Refresh EPG health and channel mappings
        run: python scripts/update_epg.py
      - name: Refresh explicitly mapped HTML EPG schedules (guarded sidecar)
        run: python scripts/update_html_epg.py
      - name: Normalize and validate
        run: |
          python scripts/normalize_catalog.py
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py
      - name: Commit changes when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog reports .github/reference-sync.sha
            git commit -m "chore(acervo): discover and merge catalog updates"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Sem alterações no acervo."
          fi
