name: Build VOD metadata review patch

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum records with existing TMDB IDs to inspect (1–1000)"
        required: true
        default: "1000"
        type: string
      offset:
        description: "Number of eligible records to skip before this batch"
        required: true
        default: "0"
        type: string
  push:
    branches:
      - audit/acervo-hardening-2026-10

permissions:
  contents: read

concurrency:
  group: acervo-vod-metadata-review
  cancel-in-progress: false

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate limit and build review-only patch through CineHUB Supabase
        env:
          CINEHUB_CATALOG_FUNCTION_URL: https://qdheeiitzlvynshvkwcs.supabase.co/functions/v1/cinehub-catalog
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIMIT: ${{ inputs.limit || '1000' }}
          OFFSET: ${{ inputs.offset || '100' }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Add SUPABASE_ANON_KEY under repository Actions secrets. TMDB_TOKEN stays in Supabase."
            exit 1
          fi
          python -m py_compile scripts/enrich_vod_metadata.py
          python scripts/enrich_vod_metadata.py \
            --limit "$LIMIT" \
            --offset "$OFFSET" \
            --output "$RUNNER_TEMP/vod-metadata-patch.json" \
            --cache "$RUNNER_TEMP/tmdb-metadata-cache.sqlite3"
      - name: Upload review-only patch
        uses: actions/upload-artifact@v4
        with:
          name: cinehub-vod-metadata-review-patch
          path: ${{ runner.temp }}/vod-metadata-patch.json
          if-no-files-found: error
          retention-days: 7
