name: Build VOD metadata candidate overlay

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Records with existing TMDB IDs to inspect per batch (1-5000)"
        required: true
        default: "500"
        type: string
      offset:
        description: "Stable starting offset among records with numeric TMDB IDs"
        required: true
        default: "0"
        type: string
      batch_count:
        description: "Number of consecutive bounded batches (1-8)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: acervo-v2-vod-metadata-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded batch inputs
        env:
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^[1-9][0-9]{0,3}$ ]] && (( LIMIT <= 5000 ))
          [[ "$OFFSET" =~ ^[0-9]+$ ]]
          [[ "$BATCH_COUNT" =~ ^[1-8]$ ]]
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Build read-only metadata proposals and staging overlays
        env:
          CINEHUB_CATALOG_FUNCTION_URL: https://qdheeiitzlvynshvkwcs.supabase.co/functions/v1/cinehub-catalog
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::SUPABASE_ANON_KEY is required to call the existing CineHUB proxy. TMDB_TOKEN remains in Supabase."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vod-metadata-batches" "$RUNNER_TEMP/vod-metadata-overlays"
          for ((batch=0; batch<BATCH_COUNT; batch++)); do
            current_offset=$((OFFSET + batch * LIMIT))
            patch="$RUNNER_TEMP/vod-metadata-batches/patch-$current_offset.json"
            summary="$RUNNER_TEMP/vod-metadata-batches/summary-$current_offset.json"
            overlay="$RUNNER_TEMP/vod-metadata-overlays/$current_offset"
            python scripts/enrich_vod_metadata.py --limit "$LIMIT" --offset "$current_offset" \
              --output "$patch" --cache "$RUNNER_TEMP/tmdb-metadata-cache.sqlite3"
            python scripts/apply_vod_metadata_patch.py --root . --patch "$patch" \
              --staging-root "$overlay" --output "$summary"
          done
          python scripts/validate_catalog.py
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: cinehub-vod-metadata-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vod-metadata-batches/*.json
            ${{ runner.temp }}/vod-metadata-overlays/
          if-no-files-found: error
          retention-days: 14
